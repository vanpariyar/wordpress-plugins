name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*/v*'
  workflow_dispatch:
    inputs:
      slug:
        description: Plugin folder slug
        required: true
        default: sahajanand-post-to-speech
      version:
        description: Plugin version (must match plugin header)
        required: true
        default: 1.0.0

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', github.event.inputs.slug, github.event.inputs.version) || github.ref_name }} to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse plugin release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ github.event.inputs.slug }}"
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            SLUG="${TAG%%/v*}"
            VERSION="${TAG#*/v}"
          fi

          echo "tag=${SLUG}/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Parsed release: plugin=$SLUG, version=$VERSION"

      - name: Check WordPress.org deploy config
        id: config
        run: |
          if [ ! -f .github/wporg-plugins.json ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No .github/wporg-plugins.json found. Skipping."
            exit 0
          fi

          if jq -e --arg slug "${{ steps.release.outputs.slug }}" 'has($slug)' .github/wporg-plugins.json >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Plugin '${{ steps.release.outputs.slug }}' is not configured for WordPress.org deploy."
          fi

      - name: Setup Node.js
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y subversion rsync jq

      - name: Dry-run deploy staging
        if: steps.config.outputs.enabled == 'true'
        run: |
          bash scripts/deploy-wordpress-org.sh \
            "${{ steps.release.outputs.slug }}" \
            "${{ steps.release.outputs.version }}" \
            --dry-run

      - name: Deploy plugin to WordPress.org SVN
        if: steps.config.outputs.enabled == 'true'
        env:
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
        run: |
          bash scripts/deploy-wordpress-org.sh \
            "${{ steps.release.outputs.slug }}" \
            "${{ steps.release.outputs.version }}"
