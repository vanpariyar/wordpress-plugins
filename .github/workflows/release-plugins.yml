name: Release WordPress Plugins

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auto Detect and Release Plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.scan.outputs.plugins }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Git Configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scan and Release Plugins
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          MONOREPO_PATH=$(pwd)
          RELEASED='[]'

          for DIR_PATH in plugins/*; do
            if [ ! -d "$DIR_PATH" ]; then
              continue
            fi

            DIR=$(basename "$DIR_PATH")

            MAIN_FILE=$(find "$DIR_PATH" -maxdepth 1 -name "*.php" -exec grep -q "Plugin Name:" {} \; -print | head -n 1)

            if [ -z "$MAIN_FILE" ]; then
              continue
            fi

            VERSION=$(grep -i "Version:" "$MAIN_FILE" | sed -r 's/.*Version:[[:space:]]*([0-9.]+).*/\1/' | tr -d '\r')

            if [ -z "$VERSION" ]; then
              echo "Could not parse version in $MAIN_FILE. Skipping."
              continue
            fi

            TAG="$DIR/v$VERSION"

            if [ -n "$(git tag -l "$TAG")" ]; then
              echo "Plugin '$DIR' (version $VERSION) is already released (Tag: $TAG). Skipping."
              continue
            fi

            echo "New version detected! Plugin '$DIR' needs to be released at version $VERSION (Tag: $TAG)..."

            ZIP_NAME="$DIR-v$VERSION.zip"

            if [ -f "$DIR_PATH/package.json" ]; then
              echo "Building and packing block plugin $DIR with scripts/pack-plugin.sh..."
              bash "$MONOREPO_PATH/scripts/pack-plugin.sh" "$DIR" "$MONOREPO_PATH"
              mv "$MONOREPO_PATH/$DIR.zip" "$ZIP_NAME"

              if ! unzip -l "$ZIP_NAME" | grep -q "$DIR/build/block.json"; then
                echo "Release zip for $DIR is missing build/block.json" >&2
                exit 1
              fi
            else
              BUILD_DIR="build_dir/$DIR"
              mkdir -p "$BUILD_DIR"
              rsync -a --exclude 'node_modules' "$DIR_PATH/" "$BUILD_DIR/"

              if [ -f "$DIR_PATH/.distignore" ]; then
                echo "Applying custom exclusions from .distignore in $DIR..."
                bash "$MONOREPO_PATH/scripts/apply-distignore.sh" "$BUILD_DIR" "$DIR_PATH/.distignore"
              else
                echo "Applying default developer file exclusions..."
                rm -rf "$BUILD_DIR/tests"
                rm -rf "$BUILD_DIR/node_modules"
                rm -rf "$BUILD_DIR/phpunit.xml.dist"
                rm -rf "$BUILD_DIR/composer.json"
                rm -rf "$BUILD_DIR/composer.lock"
                rm -rf "$BUILD_DIR/vendor"
                rm -rf "$BUILD_DIR/.git"*
              fi

              cd build_dir
              zip -r "../$ZIP_NAME" "$DIR"
              cd ..
              rm -rf "build_dir"
            fi

            git tag "$TAG"
            git push origin "$TAG"

            FRIENDLY_NAME=$(echo "$DIR" | sed -r 's/-/ /g' | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}}1')
            RELEASE_NAME="$FRIENDLY_NAME v$VERSION"

            echo "Publishing release and uploading $ZIP_NAME to GitHub..."
            gh release create "$TAG" "$ZIP_NAME" \
              --title "$RELEASE_NAME" \
              --notes "Automated release of $FRIENDLY_NAME version $VERSION."

            rm "$ZIP_NAME"

            if [ -f "$MONOREPO_PATH/.github/wporg-plugins.json" ] && jq -e --arg slug "$DIR" 'has($slug)' "$MONOREPO_PATH/.github/wporg-plugins.json" >/dev/null; then
              RELEASED=$(echo "$RELEASED" | jq -c --arg slug "$DIR" --arg version "$VERSION" '. + [{slug:$slug,version:$version}]')
              echo "Queued WordPress.org deploy for $DIR $VERSION"
            fi
          done

          echo "plugins=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "Released plugins for WordPress.org deploy: $RELEASED"

  deploy-wordpress-org:
    name: Deploy to WordPress.org
    needs: release
    if: needs.release.outputs.plugins != '[]' && needs.release.outputs.plugins != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.release.outputs.plugins) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y subversion rsync jq

      - name: Dry-run WordPress.org deploy
        run: |
          bash scripts/deploy-wordpress-org.sh \
            "${{ matrix.plugin.slug }}" \
            "${{ matrix.plugin.version }}" \
            --dry-run

      - name: Deploy to WordPress.org SVN
        env:
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
        run: |
          bash scripts/deploy-wordpress-org.sh \
            "${{ matrix.plugin.slug }}" \
            "${{ matrix.plugin.version }}"
